services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oulearning-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oulearning
      APP_USER: oulearning
      APP_PASSWORD: oulearning
      ORACLE_DATABASE: oulearning
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
