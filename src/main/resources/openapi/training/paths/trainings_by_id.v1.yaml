get:
  summary: Get a training by ID
  operationId: getTraining
  tags:
    - Trainings
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Training retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/TrainingResponse.yaml'
    '404':
      description: Training not found
put:
  summary: Update a training
  operationId: updateTraining
  tags:
    - Trainings
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/requests/UpdateTrainingRequest.yaml'
  responses:
    '200':
      description: Training updated successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/TrainingResponse.yaml'
    '404':
      description: Training not found
delete:
  summary: Delete a training
  operationId: deleteTraining
  tags:
    - Trainings
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: Training deleted successfully
    '404':
      description: Training not found
