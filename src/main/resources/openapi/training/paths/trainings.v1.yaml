post:
  summary: Create a new training
  operationId: createTraining
  tags:
    - Trainings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/requests/CreateTrainingRequest.yaml'
  responses:
    '201':
      description: Training created successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/TrainingResponse.yaml'
