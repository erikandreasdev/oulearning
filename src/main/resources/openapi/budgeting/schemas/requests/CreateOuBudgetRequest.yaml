type: object
required:
  - assignedBudget
  - fiscalYear
  - organizationalUnitId
  - owners
properties:
  assignedBudget:
    type: number
  fiscalYear:
    type: integer
    format: int32
  organizationalUnitId:
    type: integer
    format: int64
  owners:
    type: array
    items:
      type: integer
      format: int64
    minItems: 1
  includeAllChildren:
    type: boolean
    default: false
  targetChildOuIds:
    type: array
    items:
      type: integer
      format: int64
  page:
    type: integer
    format: int32
    default: 0
  size:
    type: integer
    format: int32
    default: 20
