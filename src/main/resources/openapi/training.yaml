openapi: 3.0.3
info:
  title: Training API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/trainings:
    post:
      summary: Create a new training
      operationId: createTraining
      tags:
        - Trainings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingRequest'
      responses:
        '201':
          description: Training created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
  /api/v1/trainings/{id}:
    get:
      summary: Get a training by ID
      operationId: getTraining
      tags:
        - Trainings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Training retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '404':
          description: Training not found
    put:
      summary: Update a training
      operationId: updateTraining
      tags:
        - Trainings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingRequest'
      responses:
        '200':
          description: Training updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '404':
          description: Training not found
    delete:
      summary: Delete a training
      operationId: deleteTraining
      tags:
        - Trainings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Training deleted successfully
        '404':
          description: Training not found

components:
  schemas:
    CreateTrainingRequest:
      type: object
      required:
        - requestedBy
        - organizationalUnitId
        - name
        - costAmount
        - currency
        - hours
        - purposeType
        - typeId
      properties:
        requestedBy:
          type: integer
          format: int64
        organizationalUnitId:
          type: integer
          format: int64
        name:
          type: string
        costAmount:
          type: number
        currency:
          type: string
        hours:
          type: integer
          format: int32
        purposeType:
          type: string
        purposeDescription:
          type: string
        typeId:
          type: integer
          format: int64
    UpdateTrainingRequest:
      type: object
      required:
        - name
        - costAmount
        - currency
        - hours
        - purposeType
        - typeId
      properties:
        name:
          type: string
        costAmount:
          type: number
        currency:
          type: string
        hours:
          type: integer
          format: int32
        purposeType:
          type: string
        purposeDescription:
          type: string
        typeId:
          type: integer
          format: int64
    TrainingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requestedBy:
          type: integer
          format: int64
        organizationalUnitId:
          type: integer
          format: int64
        name:
          type: string
        costAmount:
          type: number
        currency:
          type: string
        hours:
          type: integer
          format: int32
        purposeType:
          type: string
        purposeDescription:
          type: string
        typeId:
          type: integer
          format: int64
        status:
          type: string
        managerReviewModality:
          type: string
        managerReviewComments:
          type: string
        managerReviewStartDate:
          type: string
          format: date-time
        managerReviewEndDate:
          type: string
          format: date-time
        managerReviewExternalProviderId:
          type: integer
          format: int64
        managerReviewReviewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            type: integer
            format: int64
        active:
          type: boolean
