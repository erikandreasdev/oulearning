post:
  summary: Create a new employee
  operationId: createEmployee
  tags:
    - Employees
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/requests/CreateEmployeeRequest.yaml'
  responses:
    '201':
      description: Employee created successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/EmployeeResponse.yaml'
