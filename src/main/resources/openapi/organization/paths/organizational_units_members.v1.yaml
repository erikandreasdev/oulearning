post:
  summary: Assign a member to an organizational unit
  operationId: assignMember
  tags:
    - Organizational Units
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/requests/AssignEmployeeRequest.yaml'
  responses:
    '204':
      description: Member assigned
