get:
  summary: Get an employee by ID
  operationId: getEmployee
  tags:
    - Employees
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Employee details
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/EmployeeResponse.yaml'
put:
  summary: Update an employee
  operationId: updateEmployee
  tags:
    - Employees
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/requests/UpdateEmployeeRequest.yaml'
  responses:
    '200':
      description: Employee updated successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/EmployeeResponse.yaml'
delete:
  summary: Delete an employee
  operationId: deleteEmployee
  tags:
    - Employees
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: Employee deleted
