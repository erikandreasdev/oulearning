type: object
required:
  - id
  - name
  - childIds
  - owners
  - members
  - active
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  parentId:
    type: integer
    format: int64
  childIds:
    type: array
    items:
      type: integer
      format: int64
  owners:
    type: array
    items:
      type: integer
      format: int64
  members:
    type: array
    items:
      type: integer
      format: int64
  active:
    type: boolean
