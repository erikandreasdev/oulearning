spring:
  application:
    name: oulearning
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/OULEARNINGPDB}
    username: ${SPRING_DATASOURCE_USERNAME:oulearning}
    password: ${SPRING_DATASOURCE_PASSWORD:oulearning_pass}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: simple

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
